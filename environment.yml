name: xmofe
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.3
  - torchvision>=0.18
  - torchaudio>=2.3
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - pyyaml
  - jupyter
  - ffmpeg
  - libsndfile
  - pip:
      - transformers>=4.48
      - tokenizers>=0.20
      - accelerate>=0.30
      - safetensors
      - soundfile
      - librosa
      - audioread
      - decord
      - av
      - opencv-python-headless
      - pillow
      - hydra-core>=1.3
      - omegaconf
      - tensorboard
      - captum
      - requests
      - pytest
      - pytest-cov
      - ruff
      - black
      - mypy
