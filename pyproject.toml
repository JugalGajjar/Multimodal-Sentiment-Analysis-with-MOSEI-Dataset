[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmofe"
version = "0.1.0"
description = "X-MoFE: Faithful and Reliability-Aware Multimodal Fusion for Emotion and Sentiment Understanding"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Jugal Gajjar" },
    { name = "Kaustik Ranaware" },
]
keywords = [
    "multimodal",
    "sentiment-analysis",
    "emotion-recognition",
    "explainability",
    "fusion",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/JugalGajjar/Multimodal-Sentiment-Analysis-with-MOSEI-Dataset"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["legacy*", "tests*", "notebooks*", "paper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
