# External baselines borrowed from prior work for the main results tables.
#
# Per spec §15.3 ("Use official code if possible. If a baseline is too
# expensive or incompatible: report official/published results separately,
# clearly mark as 'reported from prior work'"), this file holds numbers
# imported directly from each baseline's published paper. ``make_main_tables.py``
# reads them and merges with our own results, tagging their origin so the
# table caption can mark them as reported (not reproduced).
#
# Fill in the metric values as you cite each paper. Leaving a metric as
# null tells the formatter to print a dash. Add or remove rows as needed.

