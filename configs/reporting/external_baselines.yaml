# External baselines borrowed from prior work for the main results tables.
#
# Per spec §15.3 ("Use official code if possible. If a baseline is too
# expensive or incompatible: report official/published results separately,
# clearly mark as 'reported from prior work'"), this file holds numbers
# imported directly from each baseline's published paper. Values were
# verified against the source PDFs in paper/emnlp2026/related_papers/.
#
# Keys align with the metric names produced by our Evaluator + collected
# by scripts/reporting/collect_results.py. Numerical values are in
# **fractions** (not percentages) to match our pipeline's output:
#   - mae, pearson_r        — regression metrics, native float
#   - binary_acc, binary_f1 — Acc-2 / F1-2 expressed as 0.xx
#   - accuracy, weighted_f1, macro_f1 — classification metrics as 0.xx
#
# ============================================================
# CRITICAL PROTOCOL CAVEATS — read before consuming any number
# ============================================================
#
# 1. MOSEI protocol mismatch.
#    All cited baselines (TFN, LMF, MFM, MulT, MISA, MAG-BERT, Self-MM,
#    MMIM, ALMT) evaluate on **utterance-level** CMU-MOSEI:
#      train=16,326  val=1,871  test=4,659  (total 22,856)
#    Our X-MoFE setup is **video-level** (~3,225 total). The numbers below
#    are therefore NOT apples-to-apples with our reported numbers. Either
#    (a) re-extract features and retrain on the utterance-level split, or
#    (b) report on video-level and clearly mark the protocol difference
#        in the paper. RECOMMENDED: paper-level footnote + an extra column
#        in the table noting "utterance" vs "video" split.
#
# 2. CH-SIMS version mismatch.
#    All cited CH-SIMS baselines evaluate on CH-SIMS v1 (Yu et al. ACL 2020):
#      train=1,368  val=456  test=457  (total 2,281)
#    Our setup has train=2,722 — likely CH-SIMS v2 (Yu et al. 2022). VERIFY
#    before publishing comparisons; the v1 numbers below would need v2
#    reproductions to be apples-to-apples.
#
# 3. MELD protocol matches.
#    Standard split: train=9,989 utt / val=1,109 / test=2,610 (1,039/114/280
#    dialogues). Our setup matches.
#
# 4. MELD baseline caveat (TEXT-ONLY).
#    DialogueRNN and DialogueGCN explicitly report TEXT-ONLY numbers per
#    their own papers. They are commonly cited as multimodal baselines but
#    technically aren't. Marked "(text-only)" in note fields.
#
# 5. Acc-2 / F1-2 convention for MOSEI.
#    Most papers report two variants:
#      "negative/non-negative" (zero treated as positive)
#      "negative/positive"     (zero excluded)
#    We populate `binary_acc` / `binary_f1` with the *negative/positive*
#    convention by default since that's what most recent papers (Tsai 2019
#    onward) emphasize. Where both are reported in the original, the
#    *negative/non-negative* value is recorded in the note for reference.

