# CMU-MOSEI dataset configuration
name: mosei
display_name: CMU-MOSEI

# Source
download:
  source: gdrive_folder
  url: https://drive.google.com/drive/folders/1sNPjCssAiUHVNgqnMiSEKX8P2E5GhQct
  folder_id: 1sNPjCssAiUHVNgqnMiSEKX8P2E5GhQct
  notes: |
    Mirror of CMU-MOSEI assets uploaded by the authors during the preprint work.
    Contents are downloaded with `gdown --folder` into data/raw/mosei/.

# Filesystem layout (relative to repo root)
paths:
  raw_dir: data/raw/CMU-MOSEI
  interim_dir: data/interim/mosei
  metadata_file: data/interim/mosei/metadata.jsonl
  splits_file: data/interim/mosei/splits.json

# CSD files used by CMU-MultimodalSDK to enumerate segments and labels.
# prepare_mosei.py picks the first match for each modality.
csd_files:
  language:
    - CMU_MOSEI_TimestampedWords.csd
  labels:
    - CMU_MOSEI_Labels.csd

# Standard fold IDs are exposed by mmsdk.mmdatasdk.cmu_mosei.standard_folds
# (train_fold, valid_fold, test_fold). prepare_mosei.py uses these directly.
use_standard_folds: true

# Label semantics
labels:
  task: regression
  primary: sentiment_regression  # field name inside Sample.labels
  range: [-3.0, 3.0]
  emotions: [happy, sad, anger, surprise, disgust, fear]

# Optional raw video lookup. If you have CMU-MOSEI raw mp4s, set their root
# here and prepare_mosei.py will populate Sample.video_path with start/end
# times so VideoMAEv2 feature extraction can slice clips.
video:
  root: null  # e.g. data/raw/mosei/videos
  extension: .mp4

# Per-encoder overrides applied during feature extraction. These are merged
# on top of the corresponding encoder config (configs/encoders/<name>.yaml)
# before extraction, so dataset-specific quirks stay scoped to the dataset.
#
# MOSEI rationale:
#   * text — full-video transcripts mean ~80% of samples saturate the default
#     128-token cap. Bumped to 512 to keep the tail of long monologues.
encoder_overrides:
  text:
    max_length: 512
  audio:
    # MOSEI ships pre-extracted COVAREP features instead of raw waveforms,
    # so the audio extractor reads from the CSD instead of running WavLM.
    source: csd
    csd_path: data/raw/CMU-MOSEI/CMU_MOSEI_COVAREP.csd
    feature_dim: 74
    sampling_rate: 100        # COVAREP frame rate
    max_frames: 6000          # cap at 60 seconds; longer videos truncated
    encoder_name: covarep
    encoder_source: CMU_MOSEI_COVAREP.csd
  visual:
    # MOSEI ships pre-extracted OpenFace2 features instead of raw videos.
    # The CSD is 713-dim per frame — far richer than the legacy 35-dim slice
    # — covering facial landmarks, AUs, gaze, head pose, and HoG descriptors.
    source: csd
    csd_path: data/raw/CMU-MOSEI/CMU_MOSEI_VisualOpenFace2.csd
    feature_dim: 713
    sampling_rate: 30          # ~video framerate; varies per clip
    max_frames: 3600           # ~120 sec coverage; p90 of length distribution
    encoder_name: openface2
    encoder_source: CMU_MOSEI_VisualOpenFace2.csd
