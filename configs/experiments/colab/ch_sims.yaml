# CH-SIMS training experiment — Colab A100/H100 80GB overlay.
#
# Identical to configs/experiments/ch_sims.yaml except batch=64 (4x the M4
# Pro batch of 16) and bf16 autocast. ~1.75 hr on M4 Pro per run should drop
# to ~25-40 min on A100.
#
# Usage:
#   python scripts/train/train_xmofe.py --experiment colab/ch_sims

dataset: ch_sims
manifest_dir: data/processed/ch_sims

model_config: configs/models/xmofe.yaml
loss_config: configs/training/loss.yaml

task: regression
num_classes: 1

training:
  batch_size: 64
  num_epochs: 30
  num_workers: 0
  precision: bf16
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: cosine
  gradient_clip: 1.0
  log_every: 50
  early_stopping:
    metric: mae
    mode: min
    patience: 5

run:
  project: xmofe
  name_prefix: ch_sims
