# CH-SIMS v2 sweep: sqrt LR + aux_lite weights.
#
# v1 mean MAE 0.487; early_fusion at 0.458 (-0.029). aux_lite gives task
# loss ~83% of gradient. If MAE drops below 0.46 we close the gap with
# the simplest fusion baseline while keeping reliability/interaction
# heads trainable.

dataset: ch_sims
manifest_dir: data/processed/ch_sims

model_config: configs/models/xmofe.yaml
loss_config: configs/training/loss_aux_lite.yaml

task: regression
num_classes: 1

training:
  batch_size: 64
  num_epochs: 30
  num_workers: 0
  precision: bf16
  optimizer:
    name: adamw
    lr: 2.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: cosine
  gradient_clip: 1.0
  log_every: 50
  early_stopping:
    metric: mae
    mode: min
    patience: 5

run:
  project: xmofe
  name_prefix: ch_sims
