# MELD v2 sweep: sqrt LR + aux_lite weights.
#
# Tests whether reducing the auxiliary-loss gradient share (from ~40% to
# ~17% of total) recovers MELD accuracy. v1 result was 0.578 wF1; the
# task-only-trained early_fusion beat it at 0.591. If aux_lite lands at
# 0.59+, theory 1 (aux over-regularization) is confirmed and we keep
# the explanation machinery at lighter weights.

dataset: meld
manifest_dir: data/processed/meld

model_config: configs/models/xmofe.yaml
loss_config: configs/training/loss_aux_lite.yaml

task: classification
num_classes: 7

training:
  batch_size: 64
  num_epochs: 25
  num_workers: 0
  precision: bf16
  optimizer:
    name: adamw
    lr: 2.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: cosine
  gradient_clip: 1.0
  log_every: 50
  early_stopping:
    metric: weighted_f1
    mode: max
    patience: 5

run:
  project: xmofe
  name_prefix: meld
