# CH-SIMS v2 sweep: sqrt LR + 50 epochs, patience 10.
#
# v1 stops at epoch 13-15. CH-SIMS is small (2722 train) so a longer
# budget with more patience could pull out another point or two of MAE
# if the LR fix alone isn't enough.

dataset: ch_sims
manifest_dir: data/processed/ch_sims

model_config: configs/models/xmofe.yaml
loss_config: configs/training/loss.yaml

task: regression
num_classes: 1

training:
  batch_size: 64
  num_epochs: 50
  num_workers: 0
  precision: bf16
  optimizer:
    name: adamw
    lr: 2.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: cosine
  gradient_clip: 1.0
  log_every: 50
  early_stopping:
    metric: mae
    mode: min
    patience: 10

run:
  project: xmofe
  name_prefix: ch_sims
