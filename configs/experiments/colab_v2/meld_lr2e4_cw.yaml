# MELD v2 sweep: sqrt LR + inverse-frequency class weights.
#
# Combines the LR fix with the class-imbalance fix. With 47% neutral and
# 2.6% fear, vanilla CE collapses onto neutral (look at v1's f1_class_5
# values around 0.05-0.09). Inverse-frequency weighting rebalances the
# gradient signal across classes. Highest-expected-impact single change.

dataset: meld
manifest_dir: data/processed/meld

model_config: configs/models/xmofe.yaml
loss_config: configs/training/loss_class_weighted.yaml

task: classification
num_classes: 7

training:
  batch_size: 64
  num_epochs: 25
  num_workers: 0
  precision: bf16
  optimizer:
    name: adamw
    lr: 2.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: cosine
  gradient_clip: 1.0
  log_every: 50
  early_stopping:
    metric: weighted_f1
    mode: max
    patience: 5

run:
  project: xmofe
  name_prefix: meld
