# MOSEI utterance-level (Lever-1) + sigmoid gating (Lever-3)
# + Self-MM-style auxiliary unimodal heads (Lever-4).
# Uses y_M as pseudo-label for every modality (no per-modality labels on MOSEI).

dataset: mosei
manifest_dir: data/processed/mosei

model_config: configs/models/xmofe_aux.yaml
loss_config: configs/training/loss_aux.yaml

task: regression
num_classes: 1

training:
  batch_size: 8
  num_epochs: 30
  num_workers: 0
  precision: bf16
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: cosine
  gradient_clip: 1.0
  log_every: 50
  early_stopping:
    metric: mae
    mode: min
    patience: 5

run:
  project: xmofe
  name_prefix: mosei
